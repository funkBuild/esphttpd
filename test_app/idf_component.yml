dependencies:
  # Excluded on the linux target (tools/host_test): esp_littlefs.c embeds a `DIR` by value
  # and glibc's DIR is an opaque incomplete type, so it cannot compile there. The host build
  # substitutes a stub provider (tools/host_test/linux_overlay/esp_littlefs) whose mount
  # reports "not found", so filesystem-backed tests fail visibly rather than silently pass.
  esp_littlefs:
    version: "^1.14"
    rules:
      - if: "target != linux"
